name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Lint
        run: uv run --extra dev ruff check livemedcard tests
      - name: Run test suite
        run: uv run --extra dev pytest -q
      # Витяг міряється в CI, а не «колись локально»: калібрування в
      # data/extractor_calibration.json живить поріг ескалації, тож розходження
      # між ним і поточним кодом має ламати збірку, а не тихо старіти.
      - name: Extraction benchmark (gold corpus)
        run: uv run python bench/run_extraction_bench.py

  # Образ збирається на кожен push (без публікації): зламаний Dockerfile чи
  # .dockerignore, що відрізав потрібний файл, видно до деплою, а не під час нього.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  # Деплой лише з main і лише після зелених тестів та збірки образу (ADR-06).
  # Вхід у GCP через WIF, без JSON-ключів; сам деплой робить Cloud Build
  # (cloudbuild.yaml) з тим самим SHA, що пройшов тести.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      # Поки йшли тести, у main міг прийти новіший коміт: тоді деплоїть він.
      - name: Skip if main has moved on
        id: tip
        run: |
          tip=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "$tip" = "${{ github.sha }}" ]; then echo "current=true" >> "$GITHUB_OUTPUT"
          else echo "main moved to $tip; skipping deploy of ${{ github.sha }}"; fi
      - if: steps.tip.outputs.current == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/822896283289/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: lmc-gha@apps-deploy-512911.iam.gserviceaccount.com
      - if: steps.tip.outputs.current == 'true'
        uses: google-github-actions/setup-gcloud@v2
      # trigger лише запускає збірку; чекаємо її статус, щоб невдалий деплой
      # (зокрема smoke) робив workflow червоним.
      - name: Run Cloud Build trigger and wait
        if: steps.tip.outputs.current == 'true'
        run: |
          build=$(gcloud builds triggers run lmc-deploy \
            --project=apps-deploy-512911 --region=europe-central2 \
            --sha=${{ github.sha }} --format='value(metadata.build.id)')
          echo "Cloud Build: https://console.cloud.google.com/cloud-build/builds;region=europe-central2/$build?project=apps-deploy-512911"
          while true; do
            status=$(gcloud builds describe "$build" --project=apps-deploy-512911 \
              --region=europe-central2 --format='value(status)')
            case "$status" in
              SUCCESS) echo "Deploy: $status"; exit 0 ;;
              QUEUED|PENDING|WORKING) sleep 15 ;;
              *) echo "Deploy: $status"; exit 1 ;;
            esac
          done

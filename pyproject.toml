[project]
name = "livemedcard"
version = "0.1.0"
description = "LiveMedCard — TRACE-grounded living medical card (Digital Future Hackathon MVP)"
readme = "ARCHITECTURE.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "networkx>=3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Хмарний OCR Lab (opt-in): клієнт до ZeroGPU NuExtract3 Space. Не потрібен для
# дефолтного local-first / stub-режиму.
cloud = [
    "gradio_client>=1.3",
]

[project.scripts]
livemedcard-demo = "livemedcard.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livemedcard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Гарантує імпорт пакета навіть коли uv ховає editable .pth на macOS
# (CPython 3.12 site.py пропускає hidden .pth) — тоді `pytest` працює як `python -m pytest`.
pythonpath = ["."]
